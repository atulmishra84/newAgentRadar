services:
  postgres:
    image: postgres:15-alpine
    container_name: agentRadar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentradar
      POSTGRES_USER: agentradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentradar"]
      interval: 5s
      retries: 10
    networks: [agentRadar]

  redis:
    image: redis:7-alpine
    container_name: agentRadar-redis
    restart: unless-stopped
    networks: [agentRadar]

  api:
    image: acragentradarprod.azurecr.io/agentradar-api:latest
    container_name: agentRadar-api
    restart: unless-stopped
    expose: ["4000"]
    volumes:
      - ./server.js:/app/server.js
      - ./src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_USER: agentradar
      POSTGRES_DB: agentradar
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: "false"
      DATABASE_URL: postgresql://agentradar:AgentRadarProd2026@postgres:5432/agentradar?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET}
      TENANT_ID: 7a570fd1-8a60-4115-9e1b-68f9102f4eab
      ALLOWED_ORIGINS: "https://20.228.158.234,https://agentradar.idenaccess.com"
      AZURE_SSO_CLIENT_ID: "${AZURE_SSO_CLIENT_ID}"
      AZURE_SSO_CLIENT_SECRET: "${AZURE_SSO_CLIENT_SECRET}"
      AZURE_TENANT_ID: "7a570fd1-8a60-4115-9e1b-68f9102f4eab"
      APP_URL: "https://20.228.158.234"
      LOG_ANALYTICS_WORKSPACE_ID: "da801d2c-7011-4955-8d7c-2c6f095ac4e2"
      LOG_ANALYTICS_KEY: "${LOG_ANALYTICS_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agentRadar]

  frontend:
    image: acragentradarprod.azurecr.io/agentradar-frontend:latest
    container_name: agentRadar-frontend
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health || curl -fs http://localhost/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on: [api]
    networks: [agentRadar]

volumes:
  pgdata:

networks:
  agentRadar:
    driver: bridge
