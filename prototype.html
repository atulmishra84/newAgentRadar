<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentRadar — Your CMDB for AI agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #10242c;
  --ink-soft: #3d5660;
  --muted: #6b8490;
  --line: rgba(16, 36, 44, 0.08);
  --line-strong: rgba(16, 36, 44, 0.12);
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --surface-soft: rgba(255, 255, 255, 0.5);
  --accent: #0f7a62;
  --accent-bright: #14967a;
  --accent-soft: rgba(15, 122, 98, 0.08);
  --accent-mid: rgba(15, 122, 98, 0.14);
  --warn: #b7791f;
  --warn-soft: rgba(183, 121, 31, 0.1);
  --danger: #c23b3b;
  --danger-soft: rgba(194, 59, 59, 0.1);
  --ok: #1f8a5b;
  --ok-soft: rgba(31, 138, 91, 0.1);
  --radius: 14px;
  --radius-sm: 10px;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --display: 'Bricolage Grotesque', Georgia, serif;
  --shadow: 0 1px 2px rgba(16, 36, 44, 0.04), 0 8px 24px rgba(16, 36, 44, 0.06);
  --shadow-lg: 0 2px 4px rgba(16, 36, 44, 0.04), 0 20px 48px rgba(16, 36, 44, 0.08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: #eef3f5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.mesh {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 70% 50% at 8% 0%, rgba(20, 150, 122, 0.16), transparent 55%),
    radial-gradient(ellipse 55% 45% at 95% 10%, rgba(183, 121, 31, 0.08), transparent 50%),
    radial-gradient(ellipse 50% 40% at 70% 100%, rgba(15, 90, 110, 0.1), transparent 55%),
    linear-gradient(165deg, #f7fafb 0%, #eef4f6 45%, #e8f0f2 100%);
}
.mesh::after {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2310242c' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity: 0.9;
  pointer-events: none;
}

.shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  height: 100vh;
}

.sidebar {
  padding: 1.5rem 1rem 1.25rem;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(20px) saturate(1.2);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.brand-block { padding: 0 .5rem; margin-bottom: 1.5rem; }
.brand {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.65rem;
  letter-spacing: -0.04em;
  margin: 0;
  color: var(--ink);
  line-height: 1.1;
}
.brand span { color: var(--accent); }
.tagline {
  color: var(--muted);
  font-size: 0.72rem;
  margin: 0.4rem 0 0;
  line-height: 1.4;
  max-width: 20ch;
}
.tenant-chip {
  display: flex; align-items: center; gap: 0.55rem;
  margin: 1rem 0.35rem 0;
  padding: 0.55rem 0.65rem;
  border-radius: 12px;
  background: var(--accent-soft);
  border: 1px solid rgba(15, 122, 98, 0.12);
}
.tenant-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(145deg, var(--accent-bright), var(--accent));
  color: #fff; font-size: 0.7rem; font-weight: 700;
  display: grid; place-items: center; flex-shrink: 0;
}
.tenant-chip strong { display: block; font-size: 0.78rem; color: var(--ink); }
.tenant-chip span { font-size: 0.68rem; color: var(--muted); }

.nav { flex: 1; }
.nav-label {
  font-size: 0.62rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 1.1rem 0.55rem 0.4rem;
}
.nav button {
  display: flex; align-items: center; gap: 0.55rem;
  width: 100%; text-align: left;
  padding: 0.5rem 0.7rem;
  border-radius: 10px; border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit; font-size: 0.875rem; font-weight: 500;
  cursor: pointer; margin-bottom: 2px;
  transition: background 0.18s, color 0.18s;
}
.nav button .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: transparent; flex-shrink: 0;
  transition: background 0.18s;
}
.nav button:hover { background: rgba(16, 36, 44, 0.04); color: var(--ink); }
.nav button.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.nav button.active .dot { background: var(--accent); }

.user-block {
  margin-top: auto;
  padding: 0.85rem 0.65rem 0.25rem;
  border-top: 1px solid var(--line);
}
.user-block .name { font-size: 0.85rem; font-weight: 600; color: var(--ink); }
.user-block .role {
  font-size: 0.7rem; color: var(--muted);
  text-transform: capitalize; margin-top: 2px;
}

.main {
  padding: 1.75rem 2rem 3rem;
  overflow-y: auto;
  min-width: 0;
}

.topbar {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem; margin-bottom: 1.5rem;
  animation: rise 0.45s ease both;
}
.page-head h1 {
  font-family: var(--display);
  font-size: 1.9rem;
  font-weight: 700;
  margin: 0 0 0.35rem;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.page-head p { margin: 0; color: var(--muted); max-width: 52ch; font-size: 0.92rem; line-height: 1.5; }
.topbar-meta {
  display: flex; align-items: center; gap: 0.5rem;
  flex-shrink: 0; padding-top: 0.35rem;
}
.pill-meta {
  font-size: 0.72rem; font-weight: 600;
  color: var(--ink-soft);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 0.35rem 0.7rem;
  border-radius: 8px;
}

.glass {
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.15);
  border-radius: var(--radius);
  padding: 1.15rem 1.25rem;
}
.glass-link { cursor: pointer; transition: transform 0.18s, box-shadow 0.18s; }
.glass-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

.grid { display: grid; gap: 1rem; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }

.stat {
  position: relative;
  overflow: hidden;
  animation: rise 0.5s ease both;
}
.stat:nth-child(2) { animation-delay: 0.04s; }
.stat:nth-child(3) { animation-delay: 0.08s; }
.stat:nth-child(4) { animation-delay: 0.12s; }
.stat-label {
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.stat-value {
  font-family: var(--display);
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 0.35rem 0 0.15rem;
  color: var(--ink);
  line-height: 1;
}
.stat-hint { font-size: 0.72rem; color: var(--muted); }
.stat::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0.55;
}

.btn {
  border: 1px solid var(--line-strong);
  background: var(--surface-solid);
  color: var(--ink);
  border-radius: 9px;
  padding: 0.48rem 0.9rem;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: #f8fbfc; border-color: rgba(16, 36, 44, 0.18); transform: translateY(-1px); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #fff; }
.btn-danger {
  background: var(--danger-soft);
  border-color: rgba(194, 59, 59, 0.2);
  color: var(--danger);
}
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: rgba(16, 36, 44, 0.04); color: var(--ink); border-color: transparent; }

.badge {
  display: inline-flex; align-items: center;
  padding: 0.18rem 0.5rem;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.b-critical, .b-danger { background: var(--danger-soft); color: var(--danger); }
.b-high { background: rgba(183, 121, 31, 0.12); color: var(--warn); }
.b-medium { background: rgba(183, 121, 31, 0.08); color: #9a6b18; }
.b-low, .b-ok { background: var(--ok-soft); color: var(--ok); }
.b-shadow { background: var(--danger-soft); color: var(--danger); }
.b-phi { background: var(--accent-soft); color: var(--accent); }

.table-wrap { overflow-x: auto; padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th, td {
  text-align: left;
  padding: 0.85rem 1.15rem;
  border-bottom: 1px solid var(--line);
}
th {
  color: var(--muted);
  font-weight: 600;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  background: rgba(248, 251, 252, 0.8);
  position: sticky; top: 0;
}
tbody tr { cursor: pointer; transition: background 0.12s; }
tbody tr:hover { background: rgba(15, 122, 98, 0.04); }
tbody tr:last-child td { border-bottom: 0; }
.agent-name { font-weight: 600; color: var(--ink); }
.agent-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

.toolbar {
  display: flex; gap: 0.55rem; flex-wrap: wrap;
  margin-bottom: 1rem; align-items: center;
}
input, select, textarea {
  background: var(--surface-solid);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  border-radius: 9px;
  padding: 0.52rem 0.8rem;
  font: inherit;
  font-size: 0.86rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus {
  outline: none;
  border-color: rgba(15, 122, 98, 0.45);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.muted { color: var(--muted); }

.bar {
  height: 6px;
  background: rgba(16, 36, 44, 0.06);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 0.4rem;
}
.bar > span {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  border-radius: 99px;
  transition: width 0.55s ease;
}

.heatmap {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 0.65rem;
}
.heat-cell {
  padding: 0.9rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-solid);
  transition: transform 0.15s, border-color 0.15s;
}
.heat-cell:hover { transform: translateY(-1px); border-color: rgba(15, 122, 98, 0.25); }
.row-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

.section-title {
  font-family: var(--display);
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.85rem;
  letter-spacing: -0.02em;
}

.drawer-bg {
  position: fixed; inset: 0;
  background: rgba(16, 36, 44, 0.28);
  backdrop-filter: blur(3px);
  z-index: 40;
  animation: fade 0.2s ease;
}
.drawer {
  position: fixed; top: 0; right: 0;
  width: min(440px, 100%);
  height: 100%;
  z-index: 50;
  background: rgba(255, 255, 255, 0.94);
  border-left: 1px solid var(--line);
  backdrop-filter: blur(22px);
  padding: 1.5rem;
  overflow-y: auto;
  box-shadow: -12px 0 40px rgba(16, 36, 44, 0.08);
  animation: slide 0.28s ease;
}
.drawer h2 {
  font-family: var(--display);
  font-size: 1.35rem;
  letter-spacing: -0.03em;
  margin: 0;
}
.tabs { display: flex; gap: 0.35rem; margin: 1.1rem 0; flex-wrap: wrap; }
.tab {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 8px;
  padding: 0.35rem 0.7rem;
  font: inherit; font-size: 0.78rem; font-weight: 600;
  cursor: pointer;
  text-transform: capitalize;
}
.tab.active {
  color: var(--accent);
  border-color: rgba(15, 122, 98, 0.3);
  background: var(--accent-soft);
}
.detail-row {
  display: flex; justify-content: space-between;
  gap: 1rem; padding: 0.55rem 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.88rem;
}
.detail-row:last-child { border-bottom: 0; }
.detail-row span:first-child { color: var(--muted); }
.detail-row span:last-child { font-weight: 600; text-align: right; }

.toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 60;
  background: var(--ink); color: #fff;
  padding: 0.8rem 1.1rem;
  border-radius: 12px;
  font-size: 0.85rem; font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: none;
  max-width: 320px;
}
.toast.show { display: block; animation: rise 0.28s ease; }

.login {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
}
.login-visual {
  position: relative;
  padding: 3rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}
.login-visual::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(20, 150, 122, 0.22), transparent 55%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(15, 90, 110, 0.12), transparent 50%),
    linear-gradient(160deg, #0d2a32 0%, #134049 50%, #0f3d36 100%);
  z-index: 0;
}
.login-visual > * { position: relative; z-index: 1; }
.login-brand {
  font-family: var(--display);
  font-size: clamp(2.8rem, 5vw, 4rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  color: #fff;
  margin: 0;
  line-height: 1;
}
.login-brand span { color: #5ee0bf; }
.login-visual .lead {
  color: rgba(255, 255, 255, 0.72);
  font-size: 1.1rem;
  max-width: 28ch;
  line-height: 1.55;
  margin: 1rem 0 0;
}
.login-visual .proof {
  display: grid; gap: 0.75rem;
  margin-top: auto;
}
.proof-item {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  color: rgba(255, 255, 255, 0.85);
  font-size: 0.88rem;
  backdrop-filter: blur(10px);
}
.proof-item strong { display: block; color: #fff; font-size: 0.95rem; margin-bottom: 0.2rem; }

.login-panel {
  display: grid; place-items: center;
  padding: 2.5rem;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(16px);
}
.login-card {
  width: min(400px, 100%);
  animation: rise 0.5s ease both;
}
.login-card h2 {
  font-family: var(--display);
  font-size: 1.65rem;
  letter-spacing: -0.03em;
  margin: 0 0 0.35rem;
}
.login-card .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
.form-row { margin-bottom: 0.95rem; }
.form-row label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 0.35rem;
}
.form-row input, .form-row select { width: 100%; }
.persona {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  margin-top: 1.15rem;
}
.persona button {
  text-align: left;
  padding: 0.75rem 0.8rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-solid);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.persona button:hover {
  border-color: rgba(15, 122, 98, 0.35);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.persona strong { display: block; font-size: 0.82rem; }
.persona span { font-size: 0.7rem; color: var(--muted); line-height: 1.3; display: block; margin-top: 2px; }

.alert {
  padding: 0.85rem 1rem;
  border-radius: 12px;
  font-size: 0.88rem;
  margin-bottom: 1rem;
  border: 1px solid transparent;
}
.alert-warn { background: var(--warn-soft); border-color: rgba(183, 121, 31, 0.18); color: #8a5a12; }
.alert-danger { background: var(--danger-soft); border-color: rgba(194, 59, 59, 0.18); color: var(--danger); }

.queue-item {
  display: flex; justify-content: space-between; align-items: center;
  gap: 0.75rem; padding: 0.65rem 0;
  border-bottom: 1px solid var(--line);
}
.queue-item:last-child { border-bottom: 0; }

/* Charts */
.chart-card { min-height: 280px; }
.chart-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 1rem; margin-bottom: 1rem;
}
.chart-head p { margin: 0.2rem 0 0; font-size: 0.8rem; color: var(--muted); }
.donut-wrap {
  display: grid; grid-template-columns: 160px 1fr; gap: 1.25rem; align-items: center;
}
.donut-svg { width: 160px; height: 160px; }
.legend { display: grid; gap: 0.55rem; }
.legend-row {
  display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  font-size: 0.82rem;
}
.legend-left { display: flex; align-items: center; gap: 0.5rem; color: var(--ink-soft); }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.hbar { display: grid; gap: 0.7rem; }
.hbar-row { display: grid; grid-template-columns: 92px 1fr 36px; gap: 0.65rem; align-items: center; font-size: 0.8rem; }
.hbar-track {
  height: 8px; border-radius: 99px; background: rgba(16,36,44,0.06); overflow: hidden;
}
.hbar-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  transition: width 0.6s ease;
}
.area-chart { width: 100%; height: 180px; display: block; }
.chart-empty { color: var(--muted); font-size: 0.85rem; }

/* Integrations */
.integ-hero {
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; margin-bottom: 1rem;
}
.integ-kpi {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem;
}
.integ-kpi .glass { padding: 1rem; }
.scan-bar {
  display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
  padding: 0.85rem 1rem; margin-bottom: 1rem;
}
.scan-bar .label {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); margin-right: 0.35rem;
}
.provider-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 0.65rem;
}
.provider-tile {
  text-align: left; padding: 0.9rem; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-solid);
  cursor: pointer; font: inherit; color: var(--ink);
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s, background 0.15s;
}
.provider-tile:hover {
  border-color: rgba(15,122,98,0.3); transform: translateY(-1px); box-shadow: var(--shadow);
}
.provider-tile.selected {
  border-color: rgba(15,122,98,0.45); background: var(--accent-soft);
  box-shadow: 0 0 0 3px rgba(15,122,98,0.08);
}
.provider-tile.connected { opacity: 0.72; }
.provider-ico {
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center;
  font-size: 0.68rem; font-weight: 700; color: #fff;
  background: linear-gradient(145deg, #1a8f76, #0f7a62);
  margin-bottom: 0.65rem;
}
.provider-tile strong { display: block; font-size: 0.82rem; line-height: 1.25; }
.provider-tile span { display: block; font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.04em; }

function fingerprint(a) {
  const basis = a.external_id
    ? `${a.cat||''}|${a.external_id}`
    : [a.cat||'', a.host||'', a.env||'', (a.name||'').toLowerCase(), a.model||''].join('|');
  let h = 0;
  for (let i = 0; i < basis.length; i++) h = ((h << 5) - h + basis.charCodeAt(i)) | 0;
  return Math.abs(h).toString(16).padStart(8,'0') + Math.abs(h * 31).toString(16).padStart(8,'0');
}

function scoreAgent(a, weights) {
  // Never read `state` here — SEED runs before `const state` is initialized.
  const w = { ...DEFAULT_WEIGHTS, ...(weights || {}) };
  if (a.riskAccepted && a.riskAcceptedUntil && new Date(a.riskAcceptedUntil) > new Date()) {
    return {
      score: Math.min(a.score ?? 0, 29),
      level: 'low',
      factors: [{ c: `Risk accepted until ${a.riskAcceptedUntil}`, w: 0 }],
    };
  }
  const factors = [];
  let score = 0;
  if (a.phi) { score += w.phi; factors.push({c:'PHI access',w:w.phi}); }
  if (a.pii) { score += w.pii; factors.push({c:'PII access',w:w.pii}); }
  if (a.shadow) { score += w.shadow; factors.push({c:'Shadow AI',w:w.shadow}); }
  let fails = 0;
  for (const fw of FRAMEWORKS) if ((a.fw?.[fw]||'pass') === 'fail') fails++;
  const pen = Math.min(w.compliance_cap, fails * w.compliance_per_fail);
  if (pen) { score += pen; factors.push({c:'Compliance failures',w:pen}); }
  if (!a.owner) { score += w.no_owner; factors.push({c:'No owner',w:w.no_owner}); }
  if (!a.reviewed) { score += w.never_reviewed; factors.push({c:'Never reviewed',w:w.never_reviewed}); }
  score = Math.max(0, Math.min(100, score));
  const level = score >= 75 ? 'critical' : score >= 55 ? 'high' : score >= 30 ? 'medium' : 'low';
  return { score, level, factors };
}

function buildFw(a) {
  const fw = {};
  for (const f of FRAMEWORKS) {
    let s = 'pass';
    if (a.phi && ['HIPAA','HITRUST'].includes(f) && a.baa !== 'signed') s = a.baa === 'pending' ? 'warn' : 'fail';
    if (a.shadow && ['SOC2','NIST_AI_RMF','EU_AI_ACT'].includes(f)) s = s === 'fail' ? 'fail' : 'warn';
    if (!a.owner && f === 'ISO27001') s = s === 'fail' ? 'fail' : 'warn';
    if (a.pii && f === 'GDPR' && !a.owner) s = 'fail';
    fw[f] = s;
  }
  return fw;
}

function enrich(a, weights) {

function donutChart(segments) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const r = 54, c = 2 * Math.PI * r;
  let offset = 0;
  const arcs = segments.map(seg => {
    const len = (seg.value / total) * c;
    const dash = `${len} ${c - len}`;
    const el = `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${seg.color}" stroke-width="16"
      stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" stroke-linecap="butt"/>`;
    offset += len;
    return el;
  }).join('');
  return `<svg class="donut-svg" viewBox="0 0 160 160">
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="rgba(16,36,44,0.06)" stroke-width="16"/>
    <g transform="rotate(-90 80 80)">${arcs}</g>

    <text x="80" y="94" text-anchor="middle" font-size="10" fill="#6b8490" font-family="Plus Jakarta Sans, sans-serif">agents</text>
  </svg>`;
}

function areaChart(values, labels) {
  const w = 520, h = 180, pad = 28;
  const max = Math.max(...values, 1);
  const pts = values.map((v, i) => {
    const x = pad + (i * (w - pad * 2)) / Math.max(values.length - 1, 1);
    const y = h - pad - ((v / max) * (h - pad * 2));
    return [x, y];
  });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
  const area = `${line} L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z`;
  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0f7a62"/><title>${labels[i]}: ${values[i]}</title>`).join('');
  const xLabels = labels.map((l, i) => {
    const x = pts[i][0];
    return `<text x="${x}" y="${h - 8}" text-anchor="middle" font-size="10" fill="#6b8490" font-family="Plus Jakarta Sans, sans-serif">${l}</text>`;
  }).join('');
  return `<svg class="area-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#14967a" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#14967a" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    ${[0.25,0.5,0.75,1].map(t => {
      const y = h - pad - t * (h - pad * 2);
      return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="rgba(16,36,44,0.06)" stroke-width="1"/>`;
    }).join('')}
    <path d="${area}" fill="url(#areaFill)"/>
    <path d="${line}" fill="none" stroke="#0f7a62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xLabels}
  </svg>`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function stats() {
  const a = state.agents;
  return {
    total: a.length,
    shadow: a.filter(x=>x.shadow).length,
    phi: a.filter(x=>x.phi).length,
    critical: a.filter(x=>x.level==='critical').length,
    high: a.filter(x=>x.level==='high').length,
    medium: a.filter(x=>x.level==='medium').length,
    low: a.filter(x=>x.level==='low').length,
    avg: Math.round(a.reduce((s,x)=>s+x.score,0)/a.length),
    unowned: a.filter(x=>!x.owner).length,
    never: a.filter(x=>!x.reviewed).length,
    noBaa: a.filter(x=>x.phi&&x.baa==='missing').length,
  };
}

    }
    return true;
  });
}

    byEnv[a.env][a.level]++; byEnv[a.env].total++; byEnv[a.env].sum += a.score;
  }
  const top = [...state.agents].sort((a,b)=>b.score-a.score).slice(0,8);
  const trend = [34,36,39,37,41,40,s.avg];
  const maxT = Math.max(...trend, 1);
  return `${pageHead('Risk Analytics', 'Distribution, environment heatmap, remediation priorities, and seven-day trend.',
    `<span class="pill-meta">Avg ${s.avg}</span>`)}
  <div class="grid g4">
    ${['critical','high','medium','low'].map(k=>`<div class="glass stat">
      <div class="stat-label">${k}</div>
      <div class="stat-value">${s[k]}</div>
      <div class="stat-hint">Agents by risk band</div>
    </div>`).join('')}
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="glass">
      <h3 class="section-title">Risk by environment</h3>
      <div class="heatmap">${Object.entries(byEnv).map(([env,v])=>{
        const avg=Math.round(v.sum/v.total);
        return `<div class="heat-cell" style="background:linear-gradient(180deg,#fff,rgba(194,59,59,${Math.min(0.12,avg/200)}))">
          <strong style="font-size:0.88rem">${esc(env)}</strong>
          <div class="muted" style="font-size:0.75rem;margin:4px 0">Avg score ${avg}</div>
          <div style="font-size:0.72rem;color:var(--ink-soft)">C${v.critical} · H${v.high} · M${v.medium} · L${v.low}</div>
        </div>`;
      }).join('')}</div>
    </div>
    <div class="glass">
      <h3 class="section-title">7-day estate trend</h3>
      <div style="display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px">
        ${trend.map((t,i)=>`<div style="flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end">
          <div style="height:${(t/maxT)*100}%;min-height:10px;background:linear-gradient(180deg,var(--accent-bright),var(--accent));border-radius:8px 8px 4px 4px" title="${t}"></div>
          <div class="muted" style="font-size:10px;margin-top:6px;font-weight:600">D${i+1}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>
  <div class="glass" style="margin-top:16px">
    <h3 class="section-title">Top risk agents</h3>
    ${top.map(a=>`<div class="queue-item" style="cursor:pointer" onclick="openAgent(${a.id})">

    </div>`).join('')}
  </div>`;
}

function currentView() {
  const map = {
    dashboard: viewDashboard, discovery: viewDiscovery, shadow: viewShadow, phi: viewPhi,
    risk: viewRisk, policy: viewPolicy, operations: viewOps, compliance: viewCompliance,
    playbooks: viewPlaybooks, ciso: viewCiso, models: viewModels, coverage: viewCoverage,
    integrations: viewIntegrations, sso: viewSsoIam, enforcement: viewEnforcement,
    'risk-weights': viewRiskWeights,
  };
  return (map[state.view] || viewDashboard)();
}

function render() {
  document.getElementById('app').innerHTML = state.user ? shell(currentView()) : loginView();
}

function go(view) { state.view = view; state.selected = null; render(); }
function openAgent(id) { state.selected = id; state.tab = 'identity'; render(); }
function closeAgent() { state.selected = null; render(); }
function setTab(t) { state.tab = t; render(); }
function find(id) { return state.agents.find(a => a.id === id); }
function refreshAgent(a) {
  const base = {...a}; delete base.fw; delete base.score; delete base.level; delete base.factors; delete base.confidence;
  Object.assign(a, enrich(base, state.riskWeights));
}
function approve(id) {
  const a = find(id); if (!a) return;
  a.shadow = false; a.lifecycle = 'approved'; a.reviewed = new Date().toISOString().slice(0,10);
  refreshAgent(a);
  deliverEnforcement('agent.approve', a);
  toast(`Approved · ${a.name} · enforcement notified`);
  render();
}
function quarantine(id) {
  const a = find(id); if (!a) return;
  a.lifecycle = 'quarantined'; refreshAgent(a);
  deliverEnforcement('agent.quarantine', a);
  toast(`Quarantined · ${a.name} · enforcement notified`);
  render();
}
function acceptRisk(id) {
  const a = find(id); if (!a) return;
  const reason = (document.getElementById('acceptReason')?.value || '').trim();
  const until = document.getElementById('acceptUntil')?.value;
  if (!reason || !until) { toast('Reason and expiry required'); return; }
  a.riskAccepted = true;
  a.riskAcceptedUntil = until;
  a.riskAcceptReason = reason;
  refreshAgent(a);
  toast(`Risk accepted until ${until}`);
  render();
}
function deliverEnforcement(event, agent) {
  const hints = {
    servicenow: 'create_incident',
    zscaler: 'block_or_coach',
    edr: 'contain_process',
    entra: 'conditional_access_signal',
    generic: 'notify',
  };
  for (const w of state.webhooks.filter(x => x.enabled && (x.events||[]).includes(event))) {
    state.deliveries.unshift({
      at: nowStamp(),
      event,
      webhook: w.name,
      status: 'simulated',
      hint: hints[w.kind] || 'notify',
      agent: agent.name,
    });
  }
}
function exportEstateEvidence() {
  const pkg = {
    generated_at: new Date().toISOString(),
    package_type: 'estate_evidence',
    positioning: 'Your CMDB for AI agents',
    agent_count: state.agents.length,
    packages: state.agents.map(a => ({
      fingerprint: a.fingerprint,
      external_id: a.external_id,
      name: a.name,
      risk_score: a.score,
      risk_level: a.level,
      frameworks: a.fw,
      baa: a.baa,
      lifecycle: a.lifecycle,
    })),
  };
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a'); el.href = url; el.download = 'agentradar-estate-evidence.json'; el.click();
  URL.revokeObjectURL(url);
  toast('Estate evidence downloaded');
}
function saveWebhook() {
  const name = (document.getElementById('whName')?.value || '').trim();
  const kind = document.getElementById('whKind')?.value || 'generic';
  const url = (document.getElementById('whUrl')?.value || '').trim();
  if (!name || !url) { toast('Name and URL required'); return; }
  state.webhooks.push({
    id: Date.now(), name, kind, url, enabled: true,
    events: ['agent.quarantine', 'agent.approve'],
  });
  toast('Webhook saved');
  render();
}
function removeWebhook(id) {
  state.webhooks = state.webhooks.filter(w => w.id !== id);
  toast('Webhook removed');
  render();
}
function saveRiskWeights() {
  for (const k of Object.keys(DEFAULT_WEIGHTS)) {
    const el = document.getElementById(`rw_${k}`);
    if (el) state.riskWeights[k] = Number(el.value);
  }
  state.agents.forEach(refreshAgent);
  toast('Risk weights saved · estate re-scored');
  render();
}
function resetRiskWeights() {
  state.riskWeights = { ...DEFAULT_WEIGHTS };
  state.agents.forEach(refreshAgent);
  toast('Defaults restored');
  render();
}
function setBaa(id, status) {
  const a = find(id); if (!a) return;
  a.baa = status; refreshAgent(a); toast(`BAA updated · ${status}`); render();
}
function assignOwner(id) {
  const a = find(id); if (!a) return;
  a.owner = document.getElementById('ownerInput').value.trim() || null;
  refreshAgent(a); toast('Owner saved'); render();
}
function downloadEvidence(id) {
  const a = find(id);
  const blob = new Blob([JSON.stringify({generated_at:new Date().toISOString(),agent:a,frameworks:a.fw},null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a'); el.href = url; el.download = `agentradar-evidence-${a.id}.json`; el.click();
  URL.revokeObjectURL(url);
}
function runPolicy(key, remediate) {
  const p = POLICIES.find(x => x.key === key);
  const hits = state.agents.filter(p.match);
  if (remediate) {
    for (const a of hits) {
      if (key === 'shadow_phi' || key === 'shadow_high') a.lifecycle = 'quarantined';
      if (key === 'overdue') a.lifecycle = 'under_review';
      refreshAgent(a);
    }
  }
  toast(`${p.name} · ${hits.length} ${remediate?'remediated':'found'}`);
  render();
}
function remediateAll() {
  for (const p of POLICIES) runPolicy(p.key, true);
  toast('All policies remediated');
}
function runPlaybook(i) {
  const p = PLAYBOOKS[i];
  state.log = { playbook: p.name, at: new Date().toISOString(), steps: p.steps.map(s => ({step:s, status:'complete'})) };
  if (p.name.includes('Quarantine')) state.agents.filter(a=>a.shadow).forEach(a=>{a.lifecycle='quarantined'; refreshAgent(a);});
  toast(`Ran ${p.name}`);
  render();
}
function nowStamp() {
  const d = new Date();
  return d.toISOString().slice(0,16).replace('T',' ');
}
function setIntegGroup(g) {
  state.integGroup = g;
  const first = PROVIDERS.find(p=>p.group===g);
  if (first) state.integProvider = first.id;
  render();
}
function setIntegProvider(id) {
  state.integProvider = id;
  const p = PROVIDERS.find(x => x.id === id);
  state.integMode = p?.liveCapable ? 'live' : 'demo';
  render();
}
function connect(id) {
  state.connected.add(id);
  const p = PROVIDERS.find(x=>x.id===id);
  state.connectors[id] = state.connectors[id] || {
    status:'active', agents:0, lastTested:nowStamp(), lastScanned:'—', name:p.name,
    mode: p.liveCapable ? 'live' : 'demo', firstWave: !!p.firstWave,
  };
  toast(`Connected ${p.name}`);
  go('integrations');
}
function addConnector() {
  const id = state.integProvider;
  const p = PROVIDERS.find(x=>x.id===id);
  const name = (document.getElementById('cname')?.value || '').trim() || `${p.name} connector`;
  const mode = document.getElementById('cmode')?.value || state.integMode || 'demo';
  state.connected.add(id);
  state.connectors[id] = {
    ...(state.connectors[id]||{}),
    name, status:'active', mode, firstWave: !!p.firstWave,
    lastTested:nowStamp(), lastScanned:state.connectors[id]?.lastScanned||'—',
    agents: state.connectors[id]?.agents || 0,
  };
  toast(`Saved · ${name} · ${mode === 'live' ? 'Live' : 'Demo'}`);
  render();
}
function testConnector(id) {
  if (!state.connected.has(id) && id !== state.integProvider) {
    state.connected.add(id);
  }
  const p = PROVIDERS.find(x=>x.id===id);
  state.connectors[id] = {
    ...(state.connectors[id]||{ name:p.name, agents:0, lastScanned:'—' }),
    status:'active', lastTested:nowStamp(),
  };
  state.connected.add(id);
  toast(`Connection OK · ${p.name}`);
  render();
}
function scanConnector(id, opts = {}) {
  const p = PROVIDERS.find(x=>x.id===id);
  if (!p) return 0;
  state.connected.add(id);
  const found = 1 + Math.floor(Math.random() * 3);
  state.connectors[id] = {
    ...(state.connectors[id]||{ name:p.name, status:'active', lastTested:nowStamp() }),
    agents: (state.connectors[id]?.agents||0) + found,
    lastScanned: nowStamp(),
    status:'active',
  };
  if (!opts.silent) {
    toast(`Scan complete · ${p.name} · +${found} agents`);
    render();
  }
  return found;
}
function removeConnector(id) {
  state.connected.delete(id);
  delete state.connectors[id];
  toast('Connector removed');
  render();
}
function scanCategory(g) {
  const targets = PROVIDERS.filter(p=>p.group===g && state.connected.has(p.id));
  if (!targets.length) {
    toast(`No ${GROUP_LABELS[g]||g} connectors connected`);
    return;
  }
  let total = 0;
  for (const p of targets) total += scanConnector(p.id, { silent: true });
  toast(`${GROUP_LABELS[g]||g} scan finished · ${targets.length} source(s) · +${total} agents`);
  render();
}
function scanAll() {
  if (!state.connected.size) { toast('Connect a source first'); return; }
  let total = 0;
  for (const id of [...state.connected]) total += scanConnector(id, { silent: true });
  toast(`Scan all complete · ${state.connected.size} sources · +${total} agents`);
  go('discovery');
}
function login() {
  const email = document.getElementById('email').value || 'analyst@acme.health';
  state.user = { email, name: 'Sam Chen', role: 'analyst' };
  state.view = 'dashboard';
  toast('Welcome to AgentRadar');
  render();
}
function quickLogin(name, role) {
  state.user = { name, role, email: `${role}@acme.health` };
  state.view = role === 'ciso' ? 'ciso' : role === 'platform_admin' ? 'sso' : role === 'auditor' ? 'compliance' : 'dashboard';
  toast(`Signed in as ${name}`);
  render();
}
function logout() { state.user = null; state.selected = null; render(); }

function setSsoTab(t) { state.ssoTab = t; render(); }
function toggleSso(kind) {
  state.sso[kind].enabled = !state.sso[kind].enabled;
  toast(`${kind === 'entra' ? 'Microsoft Entra' : 'SAML'} ${state.sso[kind].enabled ? 'enabled' : 'disabled'}`);
  render();
}
function saveEntra() {
  state.sso.entra.tenantId = document.getElementById('entraTenant')?.value.trim() || state.sso.entra.tenantId;
  state.sso.entra.clientId = document.getElementById('entraClient')?.value.trim() || state.sso.entra.clientId;
  state.sso.entra.domains = (document.getElementById('entraDomains')?.value || '')
    .split(',').map(s => s.trim()).filter(Boolean);
  state.sso.entra.jit = !!document.getElementById('entraJit')?.checked;
  state.sso.entra.defaultRole = document.getElementById('entraRole')?.value || 'viewer';
  state.sso.entra.lastSync = nowStamp();
  state.sso.entra.enabled = true;
  toast('Entra settings saved');
  render();
}
function saveSaml() {
  state.sso.saml.metadataUrl = document.getElementById('samlMeta')?.value.trim() || '';
  state.sso.saml.certificate = document.getElementById('samlCert')?.value.trim() || '';
  state.sso.saml.enabled = true;
  toast('SAML settings saved');
  render();
}
function testEntra() {
  if (!state.sso.entra.enabled) {
    toast('Enable Microsoft Entra first');
    state.view = 'sso'; state.ssoTab = 'entra';
    if (state.user) render();
    return;
  }
  state.user = {
    name: 'Alex Rivera',
    role: 'ciso',
    email: 'alex.rivera@acme.health',
    source: 'Entra ID',
  };
  state.view = 'sso';
  state.ssoTab = 'users';
  toast('SSO success · signed in via Microsoft Entra');
  render();
}
function ssoLogin() { testEntra(); }
function addMapping() {
  const claim = document.getElementById('mapClaim')?.value.trim();
  const value = document.getElementById('mapValue')?.value.trim();
  const role = document.getElementById('mapRole')?.value;
  if (!claim || !value || !role) { toast('Fill claim, value, and role'); return; }
  state.sso.mappings.push({ claim, value, role });
  toast('Role mapping added');
  render();
}
function removeMapping(i) {
  state.sso.mappings.splice(i, 1);
  toast('Mapping removed');
  render();
}
function changeUserRole(i, role) {
  state.iamUsers[i].role = role;
  toast(`Role updated · ${state.iamUsers[i].email}`);
  render();
}
function revokeUser(i) {
  const u = state.iamUsers[i];
  state.iamUsers.splice(i, 1);
  toast(`Access revoked · ${u.email}`);
  render();
}

render();
</script>
</body>
</html>
